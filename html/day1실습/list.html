<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <!-- list: 여러 개의 데이터를 출력 -->
    Python<br>
    JavaScript<br>
    HTML
    
    <hr> <!-- 구분선 -->

    <!-- ul: Unordered List (글머리 기호 목록) -->
    <ul>
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
    </ul>

    <!-- ol: Ordered List (번호 매기기 목록) -->
    <!-- ol: 속성(Attribute) -->
    <ol type = "a" start = "-1">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>
</body>
</html>
